<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArmStrong</title>
  </head>
  <body>
    <script>
      let x = prompt("Enter the number : ");
      let n = x;
      count = 0;
      while (n != 0) {
        count++;
        n /= 10;
      }
      n = x;
      sum = 0;
      while (n != 0) {
        sum += Math.pow(n % 10, count);
        n /= 10;
      }

      if (sum == x) {
        document.write("Yes");
      } else {
        document.write("No");
      }
    </script>
  </body>
</html>
